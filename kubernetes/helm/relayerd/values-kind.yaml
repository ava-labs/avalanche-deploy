# Local rendering/resource overrides. Security boundaries remain enabled: kindnet
# may not enforce NetworkPolicy, but disabling the policy in values would hide drift.
resources:
  relayerd:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  console:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

persistence:
  size: 1Gi
