# The pod is reachable only through Kubernetes port-forward authorization. The
# daemon listener is additionally bound to loopback inside the pod network namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "relayerd.fullname" . }}
  labels:
    {{- include "relayerd.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "relayerd.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # No pod, service, ingress controller, or load balancer may connect. Port-forward
  # authorization is enforced by the namespace Role/RoleBinding instead.
  ingress: []
  egress:
    # DNS is required to resolve the discovered RPC and optional Safe services.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dns.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dns.podSelector | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # P-Chain, Info API, and L1 EVM JSON-RPC through the discovered RPC workload.
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.rpc.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.avalanchego.httpPort }}
    # Direct Avalanche P2P connections for Warp signature aggregation.
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.validators.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.validators.p2pPort }}
    {{- if .Values.safe.enabled }}
    # Existing Avalanche Deploy Safe transaction service. The chart never installs it.
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.safe.podSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.safe.port }}
    {{- end }}
