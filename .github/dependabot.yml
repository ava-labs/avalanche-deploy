# Keep the remote-signer Go modules and the workflow actions patched.
# Minor/patch bumps are grouped into one PR per module per week to keep the
# noise down; majors stay separate so breaking changes get their own review.
# (Maintainers: extend `directories` to the other tools/ modules as desired.)
version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/tools/remote-signer"
      - "/tools/remote-signer/enclave"
      - "/tools/remote-signer/vault-plugin"
      - "/tools/remote-signer/tests"
    schedule:
      interval: weekly
    groups:
      remote-signer-go-deps:
        applies-to: version-updates
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
