name: Incremental CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege: this workflow only checks out code and runs the test suite.
permissions:
  contents: read

jobs:
  incremental:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.11"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible jq shellcheck

      - name: Install Helm
        # make test-unit runs tests/relayer-static.sh, which lints and renders the
        # relayerd chart and asserts on the rendered manifests. Pin helm here so the
        # dependency is explicit instead of inherited from the runner image.
        working-directory: ${{ runner.temp }}
        env:
          HELM_VERSION: v4.2.0
          HELM_SHA256: 97dbeb971be4ac4b27e3839976d9564c0fb35c6f3b1da89dd1e292d236af4096
        run: |
          curl -fsSL -o helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  helm.tar.gz" | sha256sum --check
          tar -xzf helm.tar.gz linux-amd64/helm
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Install ansible-lint
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-lint

      - name: Install Ansible Collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Run Incremental Test Suite
        run: make test-incremental
