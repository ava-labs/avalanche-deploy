name: remote-signer E2E (AWS)

# Manual only — this provisions real AWS infrastructure (EC2 + KMS) and costs
# money. Requires the E2E_AWS_ROLE_ARN repository variable (an OIDC-assumable
# role with the permissions listed in tools/remote-signer/docs/e2e.md).
on:
  workflow_dispatch:
    inputs:
      region:
        description: AWS region
        default: us-east-1
        required: false
      instance_type:
        description: EC2 instance type
        default: t3.xlarge
        required: false
      avalanchego_version:
        description: avalanchego release tag (must support --staking-rpc-signer-endpoint)
        default: v1.14.0
        required: false

permissions:
  id-token: write   # for AWS OIDC
  contents: read

jobs:
  e2e-aws:
    name: e2e-aws
    runs-on: ubuntu-22.04
    # Hard cap so a hung run cannot hold real AWS resources indefinitely. A
    # normal run takes ~15-20 min; on timeout/cancel the runner signals the
    # step and e2e-aws.sh's signal traps run the teardown.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tools/remote-signer
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.E2E_AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run AWS E2E
        env:
          AWS_REGION: ${{ inputs.region }}
          E2E_INSTANCE_TYPE: ${{ inputs.instance_type }}
          AVALANCHEGO_VERSION: ${{ inputs.avalanchego_version }}
        run: ./scripts/e2e-aws.sh
