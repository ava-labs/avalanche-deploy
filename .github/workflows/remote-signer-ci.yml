name: remote-signer CI

# Build + race tests for tools/remote-signer (four Go modules: root, enclave,
# vault-plugin, tests). gofmt/vet run in go-quality.yml's per-module matrix;
# this workflow covers what that one can't: -race tests, the avalanchego BLS
# compatibility cross-check, the vault-plugin Docker image, and govulncheck.
#
# blst (BLS12-381) requires CGO_ENABLED=1 and a C compiler in every job.

on:
  pull_request:
    paths:
      - "tools/remote-signer/**"
      - ".github/workflows/remote-signer-ci.yml"
  push:
    branches:
      - main
    paths:
      - "tools/remote-signer/**"
      - ".github/workflows/remote-signer-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/remote-signer

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: tools/remote-signer/go.mod
          cache-dependency-path: tools/remote-signer/go.sum

      - name: Install C build tools
        run: sudo apt-get install -y gcc

      - name: Build
        run: CGO_ENABLED=1 go build ./...

      # Race detector on the root module — the gRPC server signs concurrently.
      - name: Test (race)
        run: CGO_ENABLED=1 go test -race ./...

      # Cross-checks BLS signing (DSTs and real signatures) against
      # avalanchego's own bls package — catches the failure mode where
      # PoP/registration works but every warp signature is rejected.
      - name: BLS compatibility tests (tests module)
        run: cd tests && CGO_ENABLED=1 go test -race ./...

      # The enclave and vault-plugin are separate modules the root
      # go test cannot see — build/test them so drift is caught.
      - name: Enclave module (build)
        run: cd enclave && CGO_ENABLED=1 go build ./...

      - name: Vault-plugin module (build + test)
        run: cd vault-plugin && CGO_ENABLED=1 go build ./... && CGO_ENABLED=1 go test -race ./...

  # The vault-plugin Dockerfile is not exercised by any build or E2E path
  # (those use a bare `go build`), so build it here or it rots unnoticed.
  vault-plugin-docker:
    name: vault-plugin Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build image
        run: docker build -t vault-plugin-bls ./tools/remote-signer/vault-plugin/

      - name: Binary is extractable and statically linked
        run: |
          docker create --name tmp vault-plugin-bls
          docker cp tmp:/vault-plugin-bls ./vault-plugin-bls-out
          docker rm tmp
          file ./vault-plugin-bls-out | tee /dev/stderr | grep -q 'statically linked'

  # Fails on known vulnerabilities that the code actually calls (plus any
  # affecting the toolchain in go.mod). Scans all four modules.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: tools/remote-signer/go.mod
          cache: false

      - name: Install C build tools
        run: sudo apt-get install -y gcc

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan all modules
        run: |
          for mod in . enclave vault-plugin tests; do
            echo "=== govulncheck: $mod ==="
            (cd "tools/remote-signer/$mod" && CGO_ENABLED=1 govulncheck ./...)
          done
