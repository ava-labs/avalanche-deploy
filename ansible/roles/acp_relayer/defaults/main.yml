---
# One relayer daemon and console are installed together on rpc[0]. The control
# script supplies release artifacts and a bundle generated by relayer-setup.
acp_relayer_operation: install
acp_relayer_version: "v0.1.0"
acp_relayer_binary_local_src: ""
acp_relayer_console_image: ""

acp_relayer_user: relayerd
acp_relayer_group: relayerd
acp_relayer_binary_path: /usr/local/bin/relayerd
acp_relayer_config_dir: /etc/relayerd
acp_relayer_secrets_dir: /etc/relayerd/secrets
acp_relayer_state_dir: /var/lib/relayerd
acp_relayer_tls_dir: "{{ acp_relayer_state_dir }}/tls"
acp_relayer_keystore_path: "{{ acp_relayer_state_dir }}/keystore.json"
acp_relayer_bbolt_path: "{{ acp_relayer_state_dir }}/relayer.db"
acp_relayer_backup_dir: /var/backups/relayerd
acp_relayer_version_file: "{{ acp_relayer_config_dir }}/VERSION"
acp_relayer_funding_file: "{{ acp_relayer_config_dir }}/funding.json"

# Local files produced by relayer-setup. On a rerun, the live keystore and its
# password are deliberately preserved even though setup generated a fresh bundle.
acp_relayer_config_src: ""
acp_relayer_keystore_src: ""
acp_relayer_keystore_password_src: ""
acp_relayer_console_session_secret_src: ""
acp_relayer_console_password_hash_src: ""
acp_relayer_funding_src: ""
acp_relayer_preserve_keystore: false

acp_relayer_blockchain_id: ""
acp_relayer_safe_enabled: false
acp_relayer_safe_address: ""
acp_relayer_safe_tx_service_url: "http://127.0.0.1:8001"
acp_relayer_safe_ui_url: "http://127.0.0.1:3081"

acp_relayer_api_port: 8080
acp_relayer_console_port: 3080
acp_relayer_acceptance_timeout_seconds: 180
acp_relayer_ready_retries: 60
acp_relayer_ready_delay: 5
