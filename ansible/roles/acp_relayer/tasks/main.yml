---
- name: Validate the zero-input Relayer deployment inputs
  ansible.builtin.assert:
    that:
      - acp_relayer_operation in ['install', 'reapply', 'upgrade']
      - acp_relayer_binary_local_src | length > 0
      - acp_relayer_restore_binary_local_src | length > 0
      - acp_relayer_console_image is match('^ghcr\\.io/.+@sha256:[0-9a-f]{64}$')
      - acp_relayer_blockchain_id | length > 0
      - acp_relayer_api_port | int == 8081
      - acp_relayer_console_port | int == 3080
      - acp_relayer_target_config_schema | int >= 1
      - acp_relayer_target_state_schema | int >= acp_relayer_target_min_readable_state_schema | int
      - acp_relayer_target_state_schema | int >= acp_relayer_target_min_automatic_rollback_state_schema | int
      - not (acp_relayer_operation == 'reapply' and acp_relayer_current_state_schema | int != acp_relayer_target_state_schema | int)
    fail_msg: >-
      The Relayer role only accepts a verified local release binary, an immutable
      console image digest, and automatically discovered L1 metadata. KMS,
      plaintext keys, alternate deployment modes, and public listeners are not
      supported.

- name: Validate the generated setup bundle inputs
  ansible.builtin.assert:
    that:
      - acp_relayer_config_src | length > 0
      - acp_relayer_keystore_src | length > 0
      - acp_relayer_keystore_password_src | length > 0
      - acp_relayer_console_session_secret_src | length > 0
      - acp_relayer_funding_src | length > 0
      - acp_relayer_expected_p2p_node_id is match('^NodeID-')
      - acp_relayer_expected_tls_certificate_sha256 is match('^[0-9a-f]{64}$')
  when: acp_relayer_operation in ['install', 'reapply']

- name: Create the relayerd system group
  ansible.builtin.group:
    name: "{{ acp_relayer_group }}"
    system: true

- name: Create the relayerd system user
  ansible.builtin.user:
    name: "{{ acp_relayer_user }}"
    group: "{{ acp_relayer_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ acp_relayer_state_dir }}"
    create_home: false

- name: Create root-owned Relayer configuration directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ acp_relayer_config_dir }}", mode: "0755"}
    - {path: "{{ acp_relayer_secrets_dir }}", mode: "0700"}

- name: Create persistent Relayer state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ acp_relayer_user }}"
    group: "{{ acp_relayer_group }}"
    mode: "0700"
  loop:
    - "{{ acp_relayer_state_dir }}"
    - "{{ acp_relayer_tls_dir }}"
    - "{{ acp_relayer_backup_dir }}"

- name: Inspect the permanent Relayer P2P identity
  ansible.builtin.stat:
    path: "{{ item }}"
    checksum_algorithm: sha256
  loop:
    - "{{ acp_relayer_tls_dir }}/staker.crt"
    - "{{ acp_relayer_tls_dir }}/staker.key"
    - "{{ acp_relayer_config_dir }}/identity.json"
  register: acp_relayer_identity_files
  when: acp_relayer_operation in ['install', 'reapply']

- name: Require the identity provisioned before runtime installation
  ansible.builtin.assert:
    that:
      - acp_relayer_identity_files.results[0].stat.exists
      - acp_relayer_identity_files.results[1].stat.exists
      - acp_relayer_identity_files.results[2].stat.exists
      - acp_relayer_identity_files.results[0].stat.checksum == acp_relayer_expected_tls_certificate_sha256
    fail_msg: >-
      The permanent Relayer P2P identity is absent, partial, or different from
      the identity approved during protocol-privacy preflight. Rerun make relayer
      to stage and verify the identity before installing the runtime.
  when: acp_relayer_operation in ['install', 'reapply']

- name: Read permanent Relayer P2P identity metadata
  ansible.builtin.slurp:
    src: "{{ acp_relayer_config_dir }}/identity.json"
  register: acp_relayer_identity_file
  when: acp_relayer_operation in ['install', 'reapply']

- name: Verify permanent Relayer P2P identity metadata
  vars:
    identity: "{{ acp_relayer_identity_file.content | b64decode | from_json }}"
  ansible.builtin.assert:
    that:
      - identity.schemaVersion | int == 1
      - identity.p2pNodeId == acp_relayer_expected_p2p_node_id
      - identity.tlsCertificateSha256 == acp_relayer_expected_tls_certificate_sha256
    fail_msg: >-
      /etc/relayerd/identity.json does not match the permanent TLS certificate
      selected during protocol-privacy preflight.
  when: acp_relayer_operation in ['install', 'reapply']

- name: Check for an existing Docker installation
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: acp_relayer_docker_stat

- name: Install Docker for the systemd-managed console container
  ansible.builtin.apt:
    name: docker.io
    state: present
    update_cache: true
  when: not acp_relayer_docker_stat.stat.exists

- name: Enable Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Inspect the persistent encrypted keystore
  ansible.builtin.stat:
    path: "{{ acp_relayer_keystore_path }}"
  register: acp_relayer_keystore_stat

- name: Refuse to replace a live encrypted keystore
  ansible.builtin.assert:
    that:
      - acp_relayer_preserve_keystore | bool
    fail_msg: >-
      {{ acp_relayer_keystore_path }} already exists, but discovery did not mark
      it for preservation. Stop and inspect the existing Relayer installation;
      the role will never overwrite hot keys implicitly.
  when:
    - acp_relayer_operation in ['install', 'reapply']
    - acp_relayer_keystore_stat.stat.exists

- name: Inspect the root-only keystore password credential
  ansible.builtin.stat:
    path: "{{ acp_relayer_secrets_dir }}/keystore-password"
  register: acp_relayer_password_stat

- name: Assert preserved keys have their password credential
  ansible.builtin.assert:
    that:
      - acp_relayer_password_stat.stat.exists
      - acp_relayer_password_stat.stat.isreg
    fail_msg: >-
      The encrypted keystore exists but its systemd credential is missing at
      {{ acp_relayer_secrets_dir }}/keystore-password. Restore both from the same
      Relayer backup; generating a different password would make the keys unusable.
  when:
    - acp_relayer_operation in ['install', 'reapply']
    - acp_relayer_keystore_stat.stat.exists

- name: Back up the complete current runtime transaction for rollback
  when: acp_relayer_operation in ['reapply', 'upgrade']
  block:
    - name: Capture the exact pre-change Relayer service state
      ansible.builtin.service_facts:

    - name: Remember prior Relayer running and enablement state
      ansible.builtin.set_fact:
        acp_relayer_daemon_was_running: "{{ ansible_facts.services['relayerd.service'].state | default('') == 'running' }}"
        acp_relayer_console_was_running: "{{ ansible_facts.services['relayer-console.service'].state | default('') == 'running' }}"
        acp_relayer_daemon_was_enabled: "{{ ansible_facts.services['relayerd.service'].status | default('disabled') == 'enabled' }}"
        acp_relayer_console_was_enabled: "{{ ansible_facts.services['relayer-console.service'].status | default('disabled') == 'enabled' }}"

    - name: Verify an existing installation is complete
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ acp_relayer_binary_path }}"
        - "{{ acp_relayer_restore_binary_path }}"
        - /etc/systemd/system/relayerd.service
        - /etc/systemd/system/relayer-console.service
        - "{{ acp_relayer_config_dir }}/config.json"
        - "{{ acp_relayer_secrets_dir }}/keystore-password"
        - "{{ acp_relayer_secrets_dir }}/console-session-secret"
        - "{{ acp_relayer_secrets_dir }}/console.env"
        - "{{ acp_relayer_keystore_path }}"
        - "{{ acp_relayer_version_file }}"
        - "{{ acp_relayer_release_file }}"
        - "{{ acp_relayer_funding_file }}"
        - "{{ acp_relayer_bbolt_path }}"
      register: acp_relayer_rollback_files

    - name: Refuse mutation of an incomplete installation
      ansible.builtin.assert:
        that:
          - acp_relayer_rollback_files.results | map(attribute='stat.exists') | min
        fail_msg: >-
          The existing Relayer installation is incomplete. Restore its daemon,
          units, config, encrypted keystore, credentials, and release metadata
          before changing it.

    - name: Stop services before taking the rollback snapshot
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - relayer-console
        - relayerd

    - name: Save byte-preserving rollback copies
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ item }}.rollback"
        remote_src: true
        owner: root
        group: root
        mode: preserve
      loop:
        - "{{ acp_relayer_binary_path }}"
        - "{{ acp_relayer_restore_binary_path }}"
        - /etc/systemd/system/relayerd.service
        - /etc/systemd/system/relayer-console.service
        - "{{ acp_relayer_config_dir }}/config.json"
        - "{{ acp_relayer_secrets_dir }}/keystore-password"
        - "{{ acp_relayer_secrets_dir }}/console-session-secret"
        - "{{ acp_relayer_secrets_dir }}/console.env"
        - "{{ acp_relayer_keystore_path }}"
        - "{{ acp_relayer_version_file }}"
        - "{{ acp_relayer_release_file }}"
        - "{{ acp_relayer_funding_file }}"
        - "{{ acp_relayer_bbolt_path }}"

    - name: Inspect the optional console password hash for rollback
      ansible.builtin.stat:
        path: "{{ acp_relayer_secrets_dir }}/console-password-hash"
      register: acp_relayer_console_hash_before

    - name: Save the optional console password hash
      ansible.builtin.copy:
        src: "{{ acp_relayer_secrets_dir }}/console-password-hash"
        dest: "{{ acp_relayer_secrets_dir }}/console-password-hash.rollback"
        remote_src: true
        owner: root
        group: root
        mode: preserve
      when: acp_relayer_console_hash_before.stat.exists

  rescue:
    - name: Restart the unchanged daemon only when it was previously running
      ansible.builtin.systemd:
        name: relayerd
        state: started
        daemon_reload: true
      when: acp_relayer_daemon_was_running | bool

    - name: Restart the unchanged console only when it was previously running
      ansible.builtin.systemd:
        name: relayer-console
        state: started
        daemon_reload: true
      when: acp_relayer_console_was_running | bool

    - name: Refuse to continue without a complete offline rollback snapshot
      ansible.builtin.fail:
        msg: >-
          The Relayer change was not started because the offline rollback
          snapshot could not be completed. Each unchanged service was returned
          to its exact prior running or stopped state.

- name: Install Relayer release artifacts and units
  block:
    - name: Clear parked service state so a rerun can start the services
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - reset-failed
          - relayerd.service
          - relayer-console.service
      changed_when: false
      failed_when: false

    - name: Keep existing services stopped for the runtime transaction
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - relayer-console
        - relayerd
      when: acp_relayer_operation in ['reapply', 'upgrade']

    - name: Stage the target offline inspector before starting a modern candidate
      ansible.builtin.copy:
        src: "{{ acp_relayer_restore_binary_local_src }}"
        dest: /tmp/relayer-restore-candidate
        owner: root
        group: root
        mode: "0755"
      when:
        - acp_relayer_operation in ['reapply', 'upgrade']
        - acp_relayer_target_state_schema | int >= 2

    - name: Prove upward transition can still roll back before starting the candidate
      ansible.builtin.command:
        argv:
          - /tmp/relayer-restore-candidate
          - --check-state-compatible
          - "{{ acp_relayer_bbolt_path }}"
          - --target-state-schema
          - "{{ acp_relayer_current_state_schema | string }}"
      changed_when: false
      when:
        - acp_relayer_operation == 'upgrade'
        - acp_relayer_target_state_schema | int > acp_relayer_current_state_schema | int

    - name: Inspect the operator scanner pause before candidate validation
      ansible.builtin.stat:
        path: "{{ acp_relayer_config_dir }}/scanner-pause"
      register: acp_relayer_scanner_pause_before
      when:
        - acp_relayer_operation in ['reapply', 'upgrade']
        - acp_relayer_target_state_schema | int >= 2 or acp_relayer_current_state_schema | int >= 2

    - name: Require side-effect-free state before candidate daemon validation
      ansible.builtin.command:
        argv:
          - >-
            {{
              '/tmp/relayer-restore-candidate'
              if acp_relayer_target_state_schema | int >= 2
              else acp_relayer_restore_binary_path
            }}
          - --check-quiescent
          - "{{ acp_relayer_bbolt_path }}"
      register: acp_relayer_quiescent_check
      changed_when: false
      failed_when: >-
        acp_relayer_quiescent_check.rc != 0 and not (
          (acp_relayer_scanner_pause_before.stat.exists | default(false)) and
          ((acp_relayer_quiescent_check.stderr | regex_search(
            '^relayer-restore: state is not quiescent: 0 non-terminal operation records and [1-9][0-9]* queued scanner triggers remain$'
          )) is not none)
        )
      when:
        - acp_relayer_operation in ['reapply', 'upgrade']
        - acp_relayer_target_state_schema | int >= 2 or acp_relayer_current_state_schema | int >= 2

    - name: Prove downward transition is safe for the target state schema
      ansible.builtin.command:
        argv:
          - "{{ acp_relayer_restore_binary_path }}"
          - --check-state-compatible
          - "{{ acp_relayer_bbolt_path }}"
          - --target-state-schema
          - "{{ acp_relayer_target_state_schema | string }}"
      changed_when: false
      when:
        - acp_relayer_operation == 'upgrade'
        - acp_relayer_target_state_schema | int < acp_relayer_current_state_schema | int

    - name: Read the current config for an upgrade transform
      ansible.builtin.slurp:
        src: "{{ acp_relayer_config_dir }}/config.json"
      register: acp_relayer_current_config_file
      when: acp_relayer_operation == 'upgrade'

    - name: Build target-compatible upgrade configuration without losing unknown fields
      vars:
        current_config: "{{ acp_relayer_current_config_file.content | b64decode | from_json }}"
        scannerless_config: "{{ current_config | dict2items | rejectattr('key', 'equalto', 'scanner') | list | items2dict }}"
        current_scanner: "{{ current_config.scanner | default({}) }}"
        scanner_start: "{{ current_scanner['start-block'] | default(acp_relayer_scanner_start_block) }}"
        scanner_poll: "{{ current_scanner['poll-interval-seconds'] | default(acp_relayer_scanner_poll_seconds) }}"
      ansible.builtin.set_fact:
        acp_relayer_candidate_config: >-
          {{
            scannerless_config | combine(
              {
                'scanner': {
                  'enabled': acp_relayer_scanner_enabled | bool,
                  'poll-interval-seconds': scanner_poll | int,
                  'start-block': scanner_start | int,
                  'pause-file': '/etc/relayerd/scanner-pause'
                }
              }
              if acp_relayer_scanner_enabled | bool
              else {},
              recursive=True
            )
          }}
      when: acp_relayer_operation == 'upgrade'

    - name: Install target-compatible upgrade configuration
      ansible.builtin.copy:
        content: "{{ acp_relayer_candidate_config | to_nice_json }}"
        dest: "{{ acp_relayer_config_dir }}/config.json"
        owner: root
        group: root
        mode: "0644"
      when: acp_relayer_operation == 'upgrade'

    - name: Install the generated encrypted keystore once
      ansible.builtin.copy:
        src: "{{ acp_relayer_keystore_src }}"
        dest: "{{ acp_relayer_keystore_path }}"
        owner: "{{ acp_relayer_user }}"
        group: "{{ acp_relayer_group }}"
        mode: "0600"
      no_log: true
      when:
        - acp_relayer_operation in ['install', 'reapply']
        - not acp_relayer_keystore_stat.stat.exists

    - name: Install the generated keystore password credential once
      ansible.builtin.copy:
        src: "{{ acp_relayer_keystore_password_src }}"
        dest: "{{ acp_relayer_secrets_dir }}/keystore-password"
        owner: root
        group: root
        mode: "0400"
      no_log: true
      when:
        - acp_relayer_operation in ['install', 'reapply']
        - not acp_relayer_keystore_stat.stat.exists

    - name: Install generated daemon configuration
      ansible.builtin.copy:
        src: "{{ acp_relayer_config_src }}"
        dest: "{{ acp_relayer_config_dir }}/config.json"
        owner: root
        group: root
        mode: "0644"
      when: acp_relayer_operation in ['install', 'reapply']

    - name: Read the final existing-installation candidate configuration
      ansible.builtin.slurp:
        src: "{{ acp_relayer_config_dir }}/config.json"
      register: acp_relayer_final_config_file
      when: acp_relayer_operation in ['reapply', 'upgrade']

    - name: Build a scanner-disabled private-port pre-commit configuration
      vars:
        final_config: "{{ acp_relayer_final_config_file.content | b64decode | from_json }}"
        scanner_disabled_config: >-
          {{
            final_config | combine(
              {'scanner': final_config.scanner | combine({'enabled': false})},
              recursive=True
            )
            if final_config.scanner is defined
            else final_config
          }}
        autonomous_spend_disabled_config: >-
          {{
            scanner_disabled_config | combine(
              {
                'float-top-up': scanner_disabled_config['float-top-up'] | combine(
                  {'enabled': false, 'auto-top-up': false}
                )
              },
              recursive=True
            )
            if scanner_disabled_config['float-top-up'] is defined
            else scanner_disabled_config
          }}
      ansible.builtin.set_fact:
        acp_relayer_final_config: "{{ final_config }}"
        acp_relayer_precommit_config: >-
          {{ autonomous_spend_disabled_config | combine({'api-listen-addr': '127.0.0.1:18081'}) }}
        acp_relayer_validation_api_port: 18081
      when: acp_relayer_operation in ['reapply', 'upgrade']

    - name: Hide mutation endpoints and scanner work before the rollback boundary
      ansible.builtin.copy:
        content: "{{ acp_relayer_precommit_config | to_nice_json }}"
        dest: "{{ acp_relayer_config_dir }}/config.json"
        owner: root
        group: root
        mode: "0644"
      when: acp_relayer_operation in ['reapply', 'upgrade']

    - name: Preserve the generated funding addresses
      ansible.builtin.copy:
        src: "{{ acp_relayer_funding_src }}"
        dest: "{{ acp_relayer_funding_file }}"
        owner: root
        group: root
        mode: "0644"
        force: false
      when: acp_relayer_operation in ['install', 'reapply']

    - name: Install the generated console session secret
      ansible.builtin.copy:
        src: "{{ acp_relayer_console_session_secret_src }}"
        dest: "{{ acp_relayer_secrets_dir }}/console-session-secret"
        owner: root
        group: root
        mode: "0400"
      no_log: true
      when: acp_relayer_operation in ['install', 'reapply']

    - name: Inspect the installed console password hash
      ansible.builtin.stat:
        path: "{{ acp_relayer_secrets_dir }}/console-password-hash"
      register: acp_relayer_console_hash_stat

    - name: Install the optional console password hash
      ansible.builtin.copy:
        src: "{{ acp_relayer_console_password_hash_src }}"
        dest: "{{ acp_relayer_secrets_dir }}/console-password-hash"
        owner: root
        group: root
        mode: "0400"
      no_log: true
      when:
        - acp_relayer_operation in ['install', 'reapply']
        - acp_relayer_console_password_hash_src | length > 0

    - name: Disable console password authentication on an explicit reset
      ansible.builtin.file:
        path: "{{ acp_relayer_secrets_dir }}/console-password-hash"
        state: absent
      when:
        - acp_relayer_operation in ['install', 'reapply']
        - acp_relayer_console_password_hash_src | length == 0
        - acp_relayer_console_password_reset | bool

    - name: Render the root-only console environment
      ansible.builtin.template:
        src: console.env.j2
        dest: "{{ acp_relayer_secrets_dir }}/console.env"
        owner: root
        group: root
        mode: "0400"
      no_log: true
      when: acp_relayer_operation in ['install', 'reapply']

    - name: Pull the immutable production console image
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - pull
          - "{{ acp_relayer_console_image }}"
      register: acp_relayer_console_pull
      changed_when: "'Downloaded newer image' in acp_relayer_console_pull.stdout"

    - name: Install the daemon release
      ansible.builtin.include_tasks: install.yml

    - name: Install the offline restore and integrity utility
      ansible.builtin.copy:
        src: "{{ acp_relayer_restore_binary_local_src }}"
        dest: "{{ acp_relayer_restore_binary_path }}"
        owner: root
        group: root
        mode: "0755"

    - name: Read the installed daemon checksum
      ansible.builtin.stat:
        path: "{{ acp_relayer_binary_path }}"
        checksum_algorithm: sha256
      register: acp_relayer_installed_daemon

    - name: Record immutable release integrity metadata
      ansible.builtin.copy:
        content: >-
          {{
            {
              'version': acp_relayer_version,
              'daemonSha256': acp_relayer_installed_daemon.stat.checksum,
              'consoleImage': acp_relayer_console_image,
              'configSchema': acp_relayer_target_config_schema | int,
              'stateSchema': acp_relayer_target_state_schema | int,
              'minimumReadableStateSchema': acp_relayer_target_min_readable_state_schema | int,
              'minimumAutomaticRollbackStateSchema': acp_relayer_target_min_automatic_rollback_state_schema | int
            } | to_nice_json
          }}
        dest: "{{ acp_relayer_release_file }}"
        owner: root
        group: root
        mode: "0644"

    - name: Render the native relayerd unit
      ansible.builtin.template:
        src: relayerd.service.j2
        dest: /etc/systemd/system/relayerd.service
        owner: root
        group: root
        mode: "0644"

    - name: Render the systemd-managed console container unit
      ansible.builtin.template:
        src: relayer-console.service.j2
        dest: /etc/systemd/system/relayer-console.service
        owner: root
        group: root
        mode: "0644"

    - name: Enable and start the candidate relayerd daemon
      ansible.builtin.systemd:
        name: relayerd
        enabled: true
        state: started
        daemon_reload: true

    - name: Enable and start the console for a fresh installation
      ansible.builtin.systemd:
        name: relayer-console
        enabled: true
        state: started
        daemon_reload: true
      when: acp_relayer_operation == 'install'

    - name: Wait for relayerd readiness or stop on terminal service failure
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          if systemctl is-failed --quiet relayerd.service; then
            systemctl status relayerd.service --no-pager --full >&2 || true
            journalctl -u relayerd.service -n 40 --no-pager >&2 || true
            exit 42
          fi
          curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
            "http://127.0.0.1:{{ acp_relayer_validation_api_port | default(acp_relayer_api_port) }}/ready"
      register: acp_relayer_ready
      changed_when: false
      until: acp_relayer_ready.rc in [0, 42]
      failed_when: acp_relayer_ready.rc != 0
      retries: "{{ acp_relayer_ready_retries }}"
      delay: "{{ acp_relayer_ready_delay }}"

    - name: Wait for the console on loopback
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ acp_relayer_console_port }}/api/auth/session"
        status_code: 200
      register: acp_relayer_console_ready
      until: acp_relayer_console_ready.status == 200
      retries: 30
      delay: 5
      when: acp_relayer_operation == 'install'

    - name: Read public Relayer funding addresses
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ acp_relayer_validation_api_port | default(acp_relayer_api_port) }}/keys"
        status_code: 200
        return_content: true
      register: acp_relayer_public_keys

    - name: Validate public Relayer funding addresses
      ansible.builtin.assert:
        that:
          - acp_relayer_public_keys.json.pchainFloatAddress | length > 0
          - acp_relayer_public_keys.json.gasKeyAddress is match('^0x[0-9a-fA-F]{40}$')
        fail_msg: "Relayer is ready but did not expose both public funding addresses."

    - name: Report public Relayer funding addresses
      ansible.builtin.debug:
        msg:
          pChainFloatAddress: "{{ acp_relayer_public_keys.json.pchainFloatAddress }}"
          l1EvmGasAddress: "{{ acp_relayer_public_keys.json.gasKeyAddress }}"
          fundedFloat: "{{ acp_relayer_public_keys.json.fundedFloat }}"
          fundedGas: "{{ acp_relayer_public_keys.json.fundedGas }}"

  rescue:
    - name: Stop candidate services before restoring an existing installation
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - relayer-console
        - relayerd
      when: acp_relayer_operation in ['reapply', 'upgrade']

    - name: Stop and disable services after a failed fresh installation
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
        daemon_reload: true
      loop:
        - relayer-console
        - relayerd
      failed_when: false
      when: acp_relayer_operation == 'install'

    - name: Verify a failed fresh installation left no autonomous service running
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - --quiet
          - "{{ item }}.service"
      loop:
        - relayer-console
        - relayerd
      register: acp_relayer_failed_install_service_state
      changed_when: false
      failed_when: acp_relayer_failed_install_service_state.rc == 0
      when: acp_relayer_operation == 'install'

    - name: Verify a failed fresh installation left no autonomous service enabled
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-enabled
          - --quiet
          - "{{ item }}.service"
      loop:
        - relayer-console
        - relayerd
      register: acp_relayer_failed_install_enablement
      changed_when: false
      failed_when: acp_relayer_failed_install_enablement.rc == 0
      when: acp_relayer_operation == 'install'

    - name: Restore the complete previous runtime transaction
      ansible.builtin.copy:
        src: "{{ item }}.rollback"
        dest: "{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: preserve
      loop:
        - "{{ acp_relayer_binary_path }}"
        - "{{ acp_relayer_restore_binary_path }}"
        - /etc/systemd/system/relayerd.service
        - /etc/systemd/system/relayer-console.service
        - "{{ acp_relayer_config_dir }}/config.json"
        - "{{ acp_relayer_secrets_dir }}/keystore-password"
        - "{{ acp_relayer_secrets_dir }}/console-session-secret"
        - "{{ acp_relayer_secrets_dir }}/console.env"
        - "{{ acp_relayer_keystore_path }}"
        - "{{ acp_relayer_version_file }}"
        - "{{ acp_relayer_release_file }}"
        - "{{ acp_relayer_funding_file }}"
      when: acp_relayer_operation in ['reapply', 'upgrade']

    - name: Restore the pre-candidate database for an upward cross-schema rollback
      ansible.builtin.copy:
        src: "{{ acp_relayer_bbolt_path }}.rollback"
        dest: "{{ acp_relayer_bbolt_path }}"
        remote_src: true
        owner: "{{ acp_relayer_user }}"
        group: "{{ acp_relayer_group }}"
        mode: "0600"
      when:
        - acp_relayer_operation == 'upgrade'
        - acp_relayer_target_state_schema | int > acp_relayer_current_state_schema | int

    - name: Restore the prior optional console password hash
      ansible.builtin.copy:
        src: "{{ acp_relayer_secrets_dir }}/console-password-hash.rollback"
        dest: "{{ acp_relayer_secrets_dir }}/console-password-hash"
        remote_src: true
        owner: root
        group: root
        mode: preserve
      when:
        - acp_relayer_operation in ['reapply', 'upgrade']
        - acp_relayer_console_hash_before.stat.exists

    - name: Restore relayer ownership on the encrypted keystore
      ansible.builtin.file:
        path: "{{ acp_relayer_keystore_path }}"
        owner: "{{ acp_relayer_user }}"
        group: "{{ acp_relayer_group }}"
        mode: "0600"
      when: acp_relayer_operation in ['reapply', 'upgrade']

    - name: Remove a console password hash created during a failed transaction
      ansible.builtin.file:
        path: "{{ acp_relayer_secrets_dir }}/console-password-hash"
        state: absent
      when:
        - acp_relayer_operation in ['reapply', 'upgrade']
        - not acp_relayer_console_hash_before.stat.exists

    - name: Reload restored systemd units
      ansible.builtin.systemd:
        daemon_reload: true
      when: acp_relayer_operation in ['reapply', 'upgrade']

    - name: Restore prior service enablement exactly
      ansible.builtin.systemd:
        name: "{{ item.name }}"
        enabled: "{{ item.enabled }}"
      loop:
        - {name: relayerd, enabled: "{{ acp_relayer_daemon_was_enabled }}"}
        - {name: relayer-console, enabled: "{{ acp_relayer_console_was_enabled }}"}
      when: acp_relayer_operation in ['reapply', 'upgrade']

    - name: Start the rolled-back daemon only when it was previously running
      ansible.builtin.systemd:
        name: relayerd
        state: started
      when:
        - acp_relayer_operation in ['reapply', 'upgrade']
        - acp_relayer_daemon_was_running | bool

    - name: Start the rolled-back console only when it was previously running
      ansible.builtin.systemd:
        name: relayer-console
        state: started
      when:
        - acp_relayer_operation in ['reapply', 'upgrade']
        - acp_relayer_console_was_running | bool

    - name: Inspect the restored operator scanner pause
      ansible.builtin.stat:
        path: "{{ acp_relayer_config_dir }}/scanner-pause"
      register: acp_relayer_rollback_scanner_pause
      when:
        - acp_relayer_operation in ['reapply', 'upgrade']
        - acp_relayer_daemon_was_running | bool

    - name: Verify rolled-back daemon readiness or intentional scanner pause
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ acp_relayer_api_port }}/ready"
        status_code: [200, 503]
        return_content: true
      register: acp_relayer_rollback_ready
      until: >-
        acp_relayer_rollback_ready.status == 200 or (
          (acp_relayer_rollback_scanner_pause.stat.exists | default(false)) and
          acp_relayer_rollback_ready.status == 503 and
          (acp_relayer_rollback_ready.content | trim) == 'not ready: scanner unhealthy: paused by operator'
        )
      retries: "{{ acp_relayer_ready_retries }}"
      delay: "{{ acp_relayer_ready_delay }}"
      when:
        - acp_relayer_operation in ['reapply', 'upgrade']
        - acp_relayer_daemon_was_running | bool

    - name: Report deployment or upgrade failure
      ansible.builtin.fail:
        msg: >-
          Relayer {{ acp_relayer_operation }} failed readiness checks.
          {{
            'The prior runtime, config, credentials, units, and release metadata were restored and verified ready or intentionally scanner-paused.'
            if acp_relayer_operation in ['reapply', 'upgrade']
            else
            'Generated keys and state were preserved, and both autonomous services were stopped and disabled for a safe rerun.'
          }}

- name: Commit an existing-installation change after rollback-safe validation
  when: acp_relayer_operation in ['reapply', 'upgrade']
  block:
    - name: Install the final public-port configuration at the no-rollback commit point
      ansible.builtin.copy:
        content: "{{ acp_relayer_final_config | to_nice_json }}"
        dest: "{{ acp_relayer_config_dir }}/config.json"
        owner: root
        group: root
        mode: "0644"

    - name: Restart the committed Relayer release
      ansible.builtin.systemd:
        name: relayerd
        state: restarted
        daemon_reload: true

    - name: Verify daemon readiness or intentional scanner pause after commit
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ acp_relayer_api_port }}/ready"
        status_code: [200, 503]
        return_content: true
      register: acp_relayer_committed_ready
      until: >-
        acp_relayer_committed_ready.status == 200 or (
          (acp_relayer_scanner_pause_before.stat.exists | default(false)) and
          acp_relayer_committed_ready.status == 503 and
          (acp_relayer_committed_ready.content | trim) == 'not ready: scanner unhealthy: paused by operator'
        )
      retries: "{{ acp_relayer_ready_retries }}"
      delay: "{{ acp_relayer_ready_delay }}"

    - name: Start the console only after the rollback boundary is closed
      ansible.builtin.systemd:
        name: relayer-console
        enabled: true
        state: started
        daemon_reload: true

    - name: Verify the committed console on loopback
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ acp_relayer_console_port }}/api/auth/session"
        status_code: 200
      register: acp_relayer_committed_console_ready
      until: acp_relayer_committed_console_ready.status == 200
      retries: 30
      delay: 5

  rescue:
    - name: Stop and disable the console after a post-commit failure
      ansible.builtin.systemd:
        name: relayer-console
        state: stopped
        enabled: false
      failed_when: false

    - name: Park the post-commit daemon without rolling back its runtime or database
      block:
        - name: Disable autonomous work while retaining the new runtime and database
          vars:
            scanner_disabled_recovery_config: >-
              {{
                acp_relayer_final_config | combine(
                  {'scanner': acp_relayer_final_config.scanner | combine({'enabled': false})},
                  recursive=True
                )
                if acp_relayer_final_config.scanner is defined
                else acp_relayer_final_config
              }}
            recovery_config: >-
              {{
                scanner_disabled_recovery_config | combine(
                  {
                    'float-top-up': scanner_disabled_recovery_config['float-top-up'] | combine(
                      {'enabled': false, 'auto-top-up': false}
                    )
                  },
                  recursive=True
                )
                if scanner_disabled_recovery_config['float-top-up'] is defined
                else scanner_disabled_recovery_config
              }}
          ansible.builtin.copy:
            content: "{{ recovery_config | to_nice_json }}"
            dest: "{{ acp_relayer_config_dir }}/config.json"
            owner: root
            group: root
            mode: "0644"

        - name: Restart the new runtime with autonomous work disabled
          ansible.builtin.systemd:
            name: relayerd
            state: restarted
            daemon_reload: true

        - name: Verify recovery on the new runtime
          ansible.builtin.uri:
            url: "http://127.0.0.1:{{ acp_relayer_api_port }}/ready"
            status_code: 200
          register: acp_relayer_post_commit_recovery_ready
          until: acp_relayer_post_commit_recovery_ready.status == 200
          retries: "{{ acp_relayer_ready_retries }}"
          delay: "{{ acp_relayer_ready_delay }}"

        - name: Record ready fail-closed post-commit recovery
          ansible.builtin.set_fact:
            acp_relayer_post_commit_recovery_mode: >-
              relayerd was verified ready; scanner and float monitoring were disabled

      rescue:
        - name: Stop and disable relayerd when fail-closed restart cannot be verified
          ansible.builtin.systemd:
            name: relayerd
            state: stopped
            enabled: false
          failed_when: false

        - name: Verify failed post-commit daemon recovery left relayerd inactive
          ansible.builtin.command:
            argv:
              - /usr/bin/systemctl
              - is-active
              - --quiet
              - relayerd.service
          register: acp_relayer_post_commit_daemon_state
          changed_when: false
          failed_when: acp_relayer_post_commit_daemon_state.rc == 0

        - name: Verify failed post-commit daemon recovery left relayerd disabled
          ansible.builtin.command:
            argv:
              - /usr/bin/systemctl
              - is-enabled
              - --quiet
              - relayerd.service
          register: acp_relayer_post_commit_daemon_enablement
          changed_when: false
          failed_when: acp_relayer_post_commit_daemon_enablement.rc == 0

        - name: Record stopped fail-closed post-commit recovery
          ansible.builtin.set_fact:
            acp_relayer_post_commit_recovery_mode: >-
              relayerd could not be verified ready and was verified stopped and disabled

    - name: Verify post-commit recovery left the console inactive
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-active
          - --quiet
          - relayer-console.service
      register: acp_relayer_post_commit_console_state
      changed_when: false
      failed_when: acp_relayer_post_commit_console_state.rc == 0

    - name: Verify post-commit recovery left the console disabled
      ansible.builtin.command:
        argv:
          - /usr/bin/systemctl
          - is-enabled
          - --quiet
          - relayer-console.service
      register: acp_relayer_post_commit_console_enablement
      changed_when: false
      failed_when: acp_relayer_post_commit_console_enablement.rc == 0

    - name: Report post-commit failure without unsafe state rollback
      ansible.builtin.fail:
        msg: >-
          The candidate Relayer passed private-port validation, but final daemon
          or console activation failed after the rollback boundary. The new
          runtime and database were retained, the console was verified stopped
          and disabled, and {{ acp_relayer_post_commit_recovery_mode }}. Do
          not restore the pre-candidate database or legacy binary; inspect logs
          and rerun after repair.

- name: Remove successful runtime rollback files
  ansible.builtin.file:
    path: "{{ item }}.rollback"
    state: absent
  loop:
    - "{{ acp_relayer_binary_path }}"
    - "{{ acp_relayer_restore_binary_path }}"
    - /etc/systemd/system/relayerd.service
    - /etc/systemd/system/relayer-console.service
    - "{{ acp_relayer_config_dir }}/config.json"
    - "{{ acp_relayer_secrets_dir }}/keystore-password"
    - "{{ acp_relayer_secrets_dir }}/console-session-secret"
    - "{{ acp_relayer_secrets_dir }}/console.env"
    - "{{ acp_relayer_secrets_dir }}/console-password-hash"
    - "{{ acp_relayer_keystore_path }}"
    - "{{ acp_relayer_version_file }}"
    - "{{ acp_relayer_release_file }}"
    - "{{ acp_relayer_funding_file }}"
    - "{{ acp_relayer_bbolt_path }}"
  when: acp_relayer_operation in ['reapply', 'upgrade']

- name: Remove staged compatibility inspector
  ansible.builtin.file:
    path: /tmp/relayer-restore-candidate
    state: absent
